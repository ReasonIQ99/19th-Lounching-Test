<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020b19">
<meta name="description" content="ReasonIQ99 — Think Smart. Solve Fast. Launching 19 October 2026.">
<title>ReasonIQ99 | Coming Soon</title>
<style>
*{box-sizing:border-box}
html{background:#020b19}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at center,#071a32 0%,#020b19 70%);color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:min(100%,1100px);text-align:center}
.poster{display:block;width:100%;height:auto;max-height:calc(100vh - 48px);object-fit:contain;border-radius:4px;box-shadow:0 20px 80px rgba(0,0,0,.45)}
.logo{display:none}
@media(max-width:600px){
 body{padding:0;display:block}
 main{width:100%}
 .poster{width:100%;height:auto;max-height:none;border-radius:0}
}
@media(prefers-reduced-motion:no-preference){.poster{animation:arrive .7s ease-out both}}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<main>
  <img class="poster" src="reasoniq99-coming-soon-poster.jpg" alt="ReasonIQ99 coming soon poster — Maha Navami launch on 19 October 2026, reasoniq99@gmail.com, Founder Tr Rathod Naveen">
</main>
</body>
</html>
